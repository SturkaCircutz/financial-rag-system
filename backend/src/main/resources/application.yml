spring:
  application:
    name: financial-rag-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p requestId=%X{requestId:-unknown}"

rag:
  service:
    base-url: ${RAG_SERVICE_BASE_URL:http://localhost:8001}
    mode: ${RAG_SERVICE_MODE:stub}
    timeout: ${RAG_SERVICE_TIMEOUT:30s}

trading:
  service:
    target: ${TRADING_SERVICE_TARGET:localhost:50051}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:}
  timeout: ${OPENAI_TIMEOUT:30s}

reports:
  repository:
    mode: ${REPORT_REPOSITORY_MODE:memory}
  queue:
    mode: ${REPORT_QUEUE_MODE:memory}
  dynamodb:
    table-name: ${REPORTS_DYNAMODB_TABLE_NAME:financial-rag}
    region: ${AWS_REGION:us-east-1}
    endpoint-url: ${REPORTS_DYNAMODB_ENDPOINT_URL:http://localhost:8000}
