version: 1
scope: local-first
rules:
  - Secret values must come from environment variables or local ignored files.
  - Secret values must never be committed, logged, printed by health endpoints, or stored in evaluation outputs.
  - Local development may run without provider secrets by using stub/local modes.
  - Local deployment must run without cloud credentials by default.
required_secret_names:
  - OPENAI_API_KEY
optional_secret_names: []
